name: Build and validate

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "tests/**", "README.md", "requirements.txt", ".github/workflows/**"]
  pull_request:
    paths: ["data/**", "scripts/**", "tests/**", "README.md", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate website
        run: python scripts/build.py

      - name: Unit and integration tests
        run: pytest -q

      # Pull requests: committed outputs must already be regenerated.
      - name: Check generated outputs are up to date (PR)
        if: github.event_name == 'pull_request'
        run: python scripts/build.py --check

      # Pushes to main: regenerate and commit any changes automatically.
      - name: Regenerate website (main)
        if: github.event_name != 'pull_request'
        run: python scripts/build.py

      - name: Validate database and website
        run: python scripts/validate.py -v

      - name: Commit regenerated files
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs data/generated
            git commit -m "chore: regenerate website [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

